    <script>
      // Defensive guard against libraries trying to overwrite window.fetch
      (function() {
        const nativeFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() { return nativeFetch; },
            set: function(v) { 
              console.warn('Attempt to overwrite fetch ignored'); 
            },
            configurable: true
          });
        } catch (e) {
          console.warn("Could not lock window.fetch:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
