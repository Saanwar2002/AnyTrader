<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <title>AnyTrader | The All-in-One Local Trade & Service App</title>
    <meta name="description" content="AnyTrader is the UK's leading local trade and service platform. Post jobs, get AI estimates, and connect with 100% verified UK tradespeople & site helpers with zero lead fees." />
    <meta name="keywords" content="tradespeople, handyman, site helpers, garden digging, plumber, electrician, UK trades, local services, AnyTrader, property passport, escrow payments" />
    <meta name="theme-color" content="#002B5C" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.anytrader.co.uk/" />
    <meta property="og:title" content="AnyTrader | The All-in-One Local Trade & Service App" />
    <meta property="og:description" content="Post jobs, get AI estimates, and connect with 100% verified UK tradespeople & site helpers with zero lead fees." />
    <meta property="og:image" content="https://www.anytrader.co.uk/app-icon.jpg" />
    <meta property="og:site_name" content="AnyTrader" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.anytrader.co.uk/" />
    <meta property="twitter:title" content="AnyTrader | The All-in-One Local Trade & Service App" />
    <meta property="twitter:description" content="Post jobs, get AI estimates, and connect with 100% verified UK tradespeople & site helpers with zero lead fees." />
    <meta property="twitter:image" content="https://www.anytrader.co.uk/app-icon.jpg" />

    <!-- AI Search Engine Optimization & GEO (Generative Engine Optimization) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="AnyTrader UK" />
    <meta name="publisher" content="AnyTrader UK" />

    <!-- Structured Data (JSON-LD) for Google & AI Search Engines (ChatGPT, Perplexity, Gemini, Claude) -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "LocalBusiness",
          "@id": "https://www.anytrader.co.uk/#organization",
          "name": "AnyTrader",
          "alternateName": "AnyTrader UK",
          "url": "https://www.anytrader.co.uk",
          "logo": "https://www.anytrader.co.uk/app-icon.jpg",
          "image": "https://www.anytrader.co.uk/app-icon.jpg",
          "description": "AnyTrader is the UK's leading local trade and service marketplace featuring 86+ trade categories, zero lead fees for verified tradespeople, AI pre-quote price transparency, digital property passports, and site helper dispatch.",
          "priceRange": "£",
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "GB"
          },
          "areaServed": {
            "@type": "Country",
            "name": "United Kingdom"
          },
          "knowsAbout": [
            "Plumbing & Heating",
            "Electrical & EICR Certificates",
            "Garden Digging & Landscaping",
            "Trade Mates & Site Helpers",
            "General Labour & Demolition",
            "Emergency 24/7 Repairs",
            "Property Passports & CP12 Gas Safety",
            "Bulky Goods Transport & Couriers",
            "Wheelie Bin & Refuse Area Cleaning",
            "TradeOS Operating System"
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "AnyTrader Services",
            "itemListElement": [
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Homeowner Job Posting & AI Price Benchmarking",
                  "description": "Free job posting with instant AI price breakdown, material costs, and verified UK trade matching."
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Zero Lead Fee Tradesperson Portal",
                  "description": "Direct client bookings for UK trades with 0% lead fees, video verification badges, and built-in TradeOS invoicing."
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "General Labour, Trade Mates & Site Helpers",
                  "description": "Hire manual assistance for trenching, material offloading, demolition, skip loading, and site help with optional CSCS card verification."
                }
              }
            ]
          }
        },
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is AnyTrader?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "AnyTrader is the UK's all-in-one local trade and service app connecting homeowners, landlords, and businesses with 100% verified UK tradespeople, site helpers, and couriers with zero lead fees."
              }
            },
            {
              "@type": "Question",
              "name": "Does AnyTrader charge lead fees to tradespeople?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. AnyTrader charges zero lead fees (0% pay-per-lead), allowing tradespeople to keep 100% of their earnings."
              }
            },
            {
              "@type": "Question",
              "name": "What categories are supported on AnyTrader?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "AnyTrader supports 86+ service categories including Plumbing, Electrics, Roofing, Emergency 24/7, General Labour & Site Helpers, Garden Digging, On-Demand Bulky Delivery, Wheelie Bin Cleaning, and Social Housing Repair Maintenance."
              }
            }
          ]
        }
      ]
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnyTrader" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.stripe.com; worker-src 'self' blob:;" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/app-icon.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#002B5C" />
    <script>
      // Defensive guard against libraries trying to overwrite window.fetch
      (function() {
        const nativeFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() { return nativeFetch; },
            set: function(v) { 
              console.warn('Attempt to overwrite fetch ignored'); 
            },
            configurable: true
          });
        } catch (e) {
          console.warn("Could not lock window.fetch:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root" class="w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
