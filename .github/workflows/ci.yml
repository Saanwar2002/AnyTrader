name: CI & Security Rules Release Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-and-build-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Firebase Security Rules & Real Firestore Emulator Concurrency Tests
        run: npm run test:security-rules

      - name: Run Unit & Pen-Testing Suite
        run: npm test

      - name: Run TypeScript & Linter Checks
        run: npm run lint

      - name: Run Production Build
        run: npm run build

      - name: Run Final Release Audit
        run: npm run audit:release
